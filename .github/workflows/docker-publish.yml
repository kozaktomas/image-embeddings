name: Docker

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both targets are built in one job on purpose. They share the `base` stage, which
      # downloads a 4.5 GB checkpoint; separate matrix jobs would not share a builder and
      # would download it twice.
      - name: Extract Docker metadata (full)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Extract Docker metadata (text-only)
        id: meta-text
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: suffix=-text,onlatest=true

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image (full)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The VPS image: CPU-only, text tower only. Published as :main-text.
      - name: Build and push Docker image (text-only)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: text
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-text.outputs.tags }}
          labels: ${{ steps.meta-text.outputs.labels }}
